<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1 id="event-title">Ночь в музее</h1>
    <p>15 ноября, 18:30</p>
    <p>Музей космонавтики, проспект Мира, 111</p>
    <p>Вечерняя программа с выставкой и экскурсиями</p>

    <button id="show-program">Показать программу</button>
    <div id="program" hidden></div>
  </div>

  <form id="service-form" class="form">
    <label><input type="checkbox" id="guide"> Экскурсия с гидом</label>
    <label><input type="checkbox" id="audio"> Аудиогид</label>
    <label><input type="checkbox" id="catalog"> Каталог выставки</label>
    <button type="submit">Рассчитать</button>
  </form>

  <p id="choice-error" class="error" hidden>Выберите хотя бы одну услугу.</p>
  <p id="data-error" class="error" hidden>Ошибка данных.</p>

  <div id="result" hidden></div>
  <div id="report-json" hidden></div>

  <script src="app.js"></script>
</body>
</html>
